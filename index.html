<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>My Bookmarks</title>
    <!-- <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script> -->
    <link rel="stylesheet" href="src/styles.css" />
    <link rel="stylesheet" href="src/replacement.css" />
  </head>

  <body class="text-sans bg-dark-bg-2 text-dark-tx antialiased">
    <header>
      <h1 class="font-heading my-24 text-5xl font-bold text-yellow-400">My Bookmarks</h1>
      <nav>
        <input type="url" class="bar" id="url-bar" placeholder="Paste URL" name="u" />
        <input type="search" class="bar" id="search-bar" placeholder="Search..." name="q" />
      </nav>
      <hr />
    </header>
    <main>
      <section class="flex w-full flex-col items-center">
        <!-- <div class="text-sm md:text-base flex flex-col w-[70%] min-h-[320px] max-h-[640px] max-w-[648px] py-[2em] px-[2.5em] border-2 border-base-800 rounded-[16px] bg-base-900 mb-[1.5em] relative" > -->
        <div class="bookmark--card relative">
          <div class="bookmark--header">
            <h2 class="bookmark--title text-xl font-bold md:text-2xl">
              <a href="#" target="_blank" class="text-blue-400 underline-offset-4 hover:underline">
                <div
                  class="inline-block w-fit underline-offset-4 duration-100 ease-in-out hover:underline active:scale-125"
                >
                  Title
                </div></a
              >, by Author (2025)
            </h2>
          </div>
          <p class="text-sm md:text-base">A description of the example website.</p>
          <div class="bookmark--footer text-dark-tx-2 w-full text-sm md:text-base">
            <p class="text-sm md:text-base">24 de outubro de 2025</p>
            <div class="dot"></div>
            <div class="bookmark--tags w-full">
              <span class="bookmark--tag">#tag</span>
              <span class="bookmark--tag">#tag</span>
              <span class="bookmark--tag">#tag</span>
            </div>
          </div>
        </div>
        <div class="bookmark--card">
          <h2 class="bookmark--header">
            <a href="https://example.com" target="_blank">Title</a>, by Author (2025)
          </h2>
          <p class="bookmark--description">A description of the example website.</p>
          <div class="bookmark--footer">
            <p>24 de outubro de 2025</p>
            <div class="dot"></div>
            <div class="bookmark--tags">
              <span class="bookmark--tag">#tag</span>
              <span class="bookmark--tag">#tag</span>
              <span class="bookmark--tag">#tag</span>
            </div>
          </div>
        </div>
      </section>
      <div class="pagination"></div>
    </main>
    <footer>
      <hr />
      <p>&copy; 2025 My Bookmarks</p>
    </footer>
    <!-- <script src="src/main.jsx"></script> -->
  </body>
</html>
